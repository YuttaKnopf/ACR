name: 🧪 Tests

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: ⏬ Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.test.txt

    - name: ✅ Run tests
      run: |
        pytest test
